openapi: 3.0.3

info:
  title: EmarFix Services API
  version: 1.0.0
  description: API for the EmarFix Services application

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Authentication
    description: Authentication and account access

paths:
  /auth/register:
    post:
      summary: Register a new customer
      description: Creates a new customer account.
      operationId: registerCustomer
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - password
              properties:
                firstName:
                  type: string
                  example: Sophie

                lastName:
                  type: string
                  example: Turner

                email:
                  type: string
                  format: email
                  example: sophie@example.com

                phone:
                  type: string
                  example: "+971501234567"

                password:
                  type: string
                  format: password
                  example: "Password123!"

                profile_pic:
                  type: string
                  format: uri
                  nullable: true
                  example: "https://example.com/profile.jpg"
      responses:
        "201":
          description: Customer registered successfully

        "400":
          description: Invalid request data

        "409":
          description: Email already registered

  /auth/login:
    post:
      summary: Login
      description: Authenticates a user and returns authentication tokens.
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: sophie@example.com

                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        "200":
          description: Login successful
        "400":
          description: Invalid request data
        "401":
          description: Invalid email or password
